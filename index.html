<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.ts"></script>
    <title>Домашний каталог растений</title>
  </head>
  <body>
    <header class="container site-header">
      <p class="site-title">Домашний каталог растений</p>
      <button class="button button--primary" type="button">
        Добавить растение
      </button>
    </header>
    <main class="container">
      <section class="hero">
        <h1 class="hero__title">Сегодня растения говорят первыми.</h1>
        <p class="hero__description">
          Два экземпляра ждут воды. Остальные — в своём ритме.
        </p>
        <div class="hero__summary">
          <p class="hero__stat">
            <span class="hero__count"></span>
            <span>растений в коллекции</span>
          </p>
          <a class="button button--primary" href="#care"> Перейти к уходу </a>
        </div>
      </section>
      <section id="care">
        <h2>Уход сегодня</h2>
        <p>Просроченные показываются первыми.</p>
        <div id="care-list" class="plant-grid"></div>
      </section>
      <section>
        <h2>Вся коллекция</h2>
        <div id="plants-list" class="plant-grid"></div>
      </section>
      <section class="plant-editor">
        <h2>Новое растение</h2>
        <p>* — обязательные поля</p>
        <form id="plant-form" class="plant-form" novalidate>
          <div class="form-field">
            <label for="plant-name">Название растения*</label>
            <input
              type="text"
              name="name"
              id="plant-name"
              aria-describedby="plant-name-error"
              required
            />
            <p id="plant-name-error" class="form-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="plant-room">Комната*</label>
            <select
              name="room"
              id="plant-room"
              aria-describedby="plant-room-error"
              required
            >
              <option value="">Выберите комнату</option>
              <option value="Гостиная">Гостиная</option>
              <option value="Спальня">Спальня</option>
              <option value="Кухня">Кухня</option>
              <option value="Кабинет">Кабинет</option>
              <option value="Прихожая">Прихожая</option>
              <option value="Ванная">Ванная</option>
              <option value="Балкон">Балкон</option>
              <option value="Другое">Другое</option>
            </select>
            <p id="plant-room-error" class="form-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="plant-interval">Интервал полива, дней*</label>
            <input
              type="number"
              min="1"
              max="90"
              step="1"
              name="wateringIntervalDays"
              id="plant-interval"
              aria-describedby="plant-interval-error"
              required
            />
            <p id="plant-interval-error" class="form-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="plant-last-watered">Последний полив*</label>
            <input
              type="date"
              name="lastWateredOn"
              id="plant-last-watered"
              aria-describedby="plant-last-watered-error"
              required
            />
            <p id="plant-last-watered-error" class="form-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="plant-note">Заметка</label>
            <textarea
              rows="4"
              maxlength="240"
              name="note"
              id="plant-note"
            ></textarea>
          </div>
          <div class="plant-form__actions">
            <button type="submit" class="button button--primary">
              Добавить растение
            </button>
            <button type="reset" class="button button--edit">Очистить</button>
            <button type="button" class="button button--edit">Отмена</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="container">
      <p>Данные хранятся только в этом браузере</p>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.ts"></script>
    <title>Домашний каталог растений</title>
  </head>
  <body>
    <header class="container site-header">
      <p class="site-title">Домашний каталог растений</p>
      <button class="button button--primary" type="button">
        Добавить растение
      </button>
    </header>
    <main class="container">
      <section class="hero">
        <h1 class="hero__title">Сегодня растения говорят первыми.</h1>
        <p class="hero__description">
          Три экземпляра ждут воды. Остальные - в своем темпе
        </p>
        <div class="hero__summary">
          <p class="hero__stat">
            <span class="hero__count">07</span>
            <span>растений в коллекции</span>
          </p>
          <a class="button button--primary" href="#care"> Перейти к уходу </a>
        </div>
      </section>
      <section id="care">
        <h2>Уход сегодня</h2>
      </section>
      <section>
        <h2>Вся коллекция</h2>
      </section>
    </main>
    <footer class="container">
      <p>Данные хранятся только в этом браузере</p>
    </footer>
  </body>
</html>
